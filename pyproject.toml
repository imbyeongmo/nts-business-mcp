[project]
name = "nts-business-mcp"
version = "0.1.0"
description = "국세청 사업자등록정보 진위확인 및 상태조회 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
nts-business-mcp = "nts_business_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nts_business_mcp"]
